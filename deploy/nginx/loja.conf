# Modelo de site do nginx. Troque loja.dominio.com.br pelo dominio real e os caminhos do certificado
# (ex.: emitido pelo certbot). Se o servidor usa CloudPanel, crie um site do tipo proxy reverso para
# http://127.0.0.1:3010 e confira que os cabecalhos abaixo estao presentes no vhost gerado.

server {
    listen 80;
    listen [::]:80;
    server_name loja.dominio.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name loja.dominio.com.br;

    ssl_certificate     /etc/letsencrypt/live/loja.dominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loja.dominio.com.br/privkey.pem;

    # Fotos de produto (ate 8 MB) e XML de nota de compra.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Sobrescreve (nao acrescenta): o cliente nao consegue escolher o proprio IP. Par com TRUST_PROXY=1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
