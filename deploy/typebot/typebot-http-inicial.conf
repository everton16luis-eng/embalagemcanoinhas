# Typebot, antes do certificado (docs/11-typebot.md, passo 6): so a porta 80, so para o certbot (webroot).
# Arquivo proprio em sites-available/sites-enabled. Nao editar arquivos de outros sites.
server {
    listen 80;
    listen [::]:80;
    server_name typebot.embalagemcanoinhas.com.br bot.embalagemcanoinhas.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 404;
    }
}
