# Arquivo temporario: so responde o desafio do certbot (webroot) para o webmail da loja.
# Depois do certificado emitido, e substituido pela copia do arquivo do barbasystem (docs/EMAIL.md, passo 7).
server {
    listen 80;
    listen [::]:80;
    server_name webmail.embalagemcanoinhas.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 404;
    }
}
