# Primeira etapa: so a porta 80, para o certbot validar o dominio pelo webroot.
# Depois do certificado emitido, substituir por loja.conf.

server {
    listen 80;
    listen [::]:80;
    server_name embalagemcanoinhas.com.br www.embalagemcanoinhas.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 503;
    }
}
