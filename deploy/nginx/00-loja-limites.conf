# Limite por IP da loja (auditoria 11/2026), usado por loja.conf e loja-ip-temporario.conf.
# Segura um unico endereco disparando requisicoes antes que ele ocupe a renderizacao das paginas.
# Folgado para cliente real e para varias pessoas atras do mesmo Wi-Fi/operadora: 20 req/s com rajada de 80
# (uma pagina com fotos faz ~15 de uma vez) e ate 60 conexoes simultaneas por IP.
#
# Os arquivos de sites-enabled sao incluidos dentro do bloco http do nginx, por isso as zonas podem ficar aqui.
# O "00-" faz este arquivo ser lido antes dos sites; os nomes "loja_" nao colidem com outros sites.
#
# Instalar:  sudo cp /srv/loja-embalagens/deploy/nginx/00-loja-limites.conf /etc/nginx/sites-enabled/
# Reverter:  apagar este arquivo e as linhas limit_req/limit_conn dos arquivos da loja; nginx -t; reload.
limit_req_zone $binary_remote_addr zone=loja_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=loja_conn:10m;
