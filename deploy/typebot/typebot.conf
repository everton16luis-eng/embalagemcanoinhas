# Typebot com HTTPS (docs/11-typebot.md, passo 7). Instalar so depois do certificado.
# O Typebot so fala HTTP: o nginx faz o HTTPS e repassa para 127.0.0.1 (editor 3091, executor 3092).
# Certificado por `certbot certonly --webroot -w /var/www/letsencrypt`. Nao editar arquivos de outros sites.

server {
    listen 80;
    listen [::]:80;
    server_name typebot.embalagemcanoinhas.com.br bot.embalagemcanoinhas.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Editor dos fluxos.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name typebot.embalagemcanoinhas.com.br;

    ssl_certificate     /etc/letsencrypt/live/typebot.embalagemcanoinhas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/typebot.embalagemcanoinhas.com.br/privkey.pem;

    client_max_body_size 10m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# Executor dos fluxos e API de conversa.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bot.embalagemcanoinhas.com.br;

    ssl_certificate     /etc/letsencrypt/live/typebot.embalagemcanoinhas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/typebot.embalagemcanoinhas.com.br/privkey.pem;

    client_max_body_size 10m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # A documentacao pede o envio sem espera (flush_interval -1 no Caddy) para as respostas em partes.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
