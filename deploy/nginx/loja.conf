# Site da loja no nginx: embalagemcanoinhas.com.br (www redireciona para o dominio sem www).
# Instalar so DEPOIS de emitir o certificado; antes, usar loja-http.conf (so a porta 80).
# Servidor com CloudPanel: arquivo proprio em sites-available/sites-enabled, certificado por
# `certbot certonly --webroot -w /var/www/letsencrypt` (o plugin --nginx ja quebrou o default.conf do CloudPanel).
# Nao editar arquivos de outros sites do servidor.

server {
    listen 80;
    listen [::]:80;
    server_name embalagemcanoinhas.com.br www.embalagemcanoinhas.com.br;

    # Renovacao do certificado (webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://embalagemcanoinhas.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.embalagemcanoinhas.com.br;

    ssl_certificate     /etc/letsencrypt/live/embalagemcanoinhas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/embalagemcanoinhas.com.br/privkey.pem;

    return 301 https://embalagemcanoinhas.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name embalagemcanoinhas.com.br;

    ssl_certificate     /etc/letsencrypt/live/embalagemcanoinhas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/embalagemcanoinhas.com.br/privkey.pem;

    # Fotos de produto (ate 8 MB) e XML de nota de compra.
    client_max_body_size 12m;

    location / {
        # 3020: a porta 3010 ja e usada por outro sistema neste servidor.
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Sobrescreve (nao acrescenta): o cliente nao consegue escolher o proprio IP. Par com TRUST_PROXY=1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
