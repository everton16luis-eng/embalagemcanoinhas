# TEMPORARIO: acesso pelo IP enquanto o DNS do dominio nao responde.
# https://187.41.99.91:8447 com certificado autoassinado (o navegador avisa; aceitar so neste teste).
# Exige APP_ORIGIN e PUBLIC_API_URL = https://187.41.99.91:8447 no .env (a API recusa outra origem).
# Remover este arquivo e voltar o .env para https://embalagemcanoinhas.com.br quando o dominio estiver no ar.
# A 8443 e do CloudPanel; nao usar.

server {
    listen 8447 ssl;
    http2 on;
    server_name 187.41.99.91;

    ssl_certificate     /etc/ssl/certs/loja-ip-temporario.crt;
    ssl_certificate_key /etc/ssl/private/loja-ip-temporario.key;

    client_max_body_size 12m;
    server_tokens off;

    # Zonas em 00-loja-limites.conf.
    limit_req zone=loja_req burst=80 nodelay;
    limit_conn loja_conn 60;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        proxy_pass http://127.0.0.1:3047;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
